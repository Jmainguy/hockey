<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playoff series — NHL Fan Hub</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    primary: '#0d47a1',
                    secondary: '#1565c0',
                    accent: '#ffb300'
                }
            }
        }
    }
    </script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-6">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
            <a href="/" class="text-primary font-semibold hover:underline">← Home</a>
            <div class="flex flex-wrap gap-2">
                <a href="/scores" class="px-4 py-2 bg-white rounded-lg shadow font-semibold text-gray-800 hover:shadow-md transition">Scores</a>
                <a href="/" class="px-4 py-2 bg-white rounded-lg shadow font-semibold text-gray-800 hover:shadow-md transition">Teams</a>
            </div>
        </div>

        <div id="seriesLoading" class="text-center text-gray-500 py-8">Loading series…</div>
        <div id="seriesError" class="hidden text-red-600 bg-red-50 border border-red-200 rounded-xl p-4 mb-6"></div>

        <div id="seriesPageHero" class="hidden bg-primary rounded-2xl shadow-lg shadow-primary/20 p-6 sm:p-8 mb-8 border border-white/10"></div>

        <div id="seriesContent" class="hidden space-y-8">
            <section id="seriesUpNext" class="hidden">
                <h2 class="text-lg font-extrabold text-gray-900 mb-4 flex items-center gap-2">
                    <span class="h-1 w-8 bg-accent rounded-full" aria-hidden="true"></span>
                    Next game
                </h2>
                <div id="seriesUpNextBody"></div>
            </section>
            <section>
                <h2 class="text-lg font-extrabold text-gray-900 mb-4 flex items-center gap-2">
                    <span class="h-1 w-8 bg-primary rounded-full" aria-hidden="true"></span>
                    Games in this series
                </h2>
                <div id="seriesGameList" class="space-y-4"></div>
            </section>
        </div>
    </div>
    <script src="/static/playoff-series.js"></script>
</body>
</html>
