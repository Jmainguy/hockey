<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL Standings - Barnwide</title>    <link rel="icon" href="/static/favicon.ico?v=barnwide" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v=barnwide">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v=barnwide">    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/utilities.css">
<link rel="stylesheet" href="/static/design.css">
<script src="/static/site.js"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
<a class="skip-link" href="#mainContent">Skip to content</a>
<nav class="site-nav" aria-label="Main navigation"><a class="brand" href="/"><img class="brand-arena" src="/static/barnwide-mark.png" width="64" height="44" alt=""><span>Barnwide</span></a><div class="nav-links"><a href="/">Teams</a><a href="/scores">Scores</a><a href="/standings">Standings</a></div></nav>
<div id="dataStatus" class="data-status hidden" role="status"></div>

    <div id="mainContent" class="max-w-7xl mx-auto px-6 py-8">
        <header class="bg-gradient-to-r from-primary to-secondary text-white rounded-3xl p-10 shadow-xl relative overflow-hidden mb-8">
            <div class="absolute inset-0 bg-[radial-gradient(circle_at_80%_20%,rgba(255,255,255,0.25),transparent_60%)]"></div>
                <div class="relative z-10 flex items-center justify-between flex-wrap gap-4">
                <div>
                    <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight flex items-center gap-4"><span></span> NHL Standings</h1>

                </div>

            </div>
        </header>

        <div class="season-controls"><label for="seasonSelect">Season <select id="seasonSelect"><option value="">Latest available</option></select></label><div role="group" aria-label="Competition"><button id="preseasonView" aria-pressed="false">Preseason</button><button id="regularView" aria-pressed="true">Regular season</button><button id="playoffView" aria-pressed="false">Playoffs</button></div></div>
        <section id="playoffViewContent" hidden aria-label="Playoff bracket"><div id="championBanner"></div><div class="bracket-scroll" tabindex="0" aria-label="Playoff tree, scroll horizontally for later rounds"><div id="seasonBracket" class="season-bracket"></div></div></section>
        <section id="regularViewContent">
        <!-- Filter Buttons -->
        <div class="standings-filters mb-2 flex flex-wrap gap-3 items-center">
            <button id="filterLeague" class="filter-btn active px-6 py-3 rounded-lg font-bold transition shadow-md">League</button>
            <button id="filterEastern" class="filter-btn px-6 py-3 rounded-lg font-bold transition shadow-md">Eastern Conference</button>
            <button id="filterWestern" class="filter-btn px-6 py-3 rounded-lg font-bold transition shadow-md">Western Conference</button>
            <button id="filterAtlantic" class="filter-btn px-6 py-3 rounded-lg font-bold transition shadow-md">Atlantic</button>
            <button id="filterMetropolitan" class="filter-btn px-6 py-3 rounded-lg font-bold transition shadow-md">Metropolitan</button>
            <button id="filterCentral" class="filter-btn px-6 py-3 rounded-lg font-bold transition shadow-md">Central</button>
            <button id="filterPacific" class="filter-btn px-6 py-3 rounded-lg font-bold transition shadow-md">Pacific</button>
        </div>

        <p id="standingsSeason" class="season-note" hidden></p>
<div id="loading" class="text-center text-gray-500 py-12 text-lg">Loading standings...</div>
        <div id="seasonNotice" class="season-notice" role="status" hidden></div>
        <div id="error" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4"></div>

        <!-- Standings Table -->
        <div id="standingsContainer" class="hidden">
            <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
                <!-- Mobile: stacked cards (no horizontal scroll) -->
                <div id="standingsCards" class="sm:hidden px-4 py-4"></div>
                <!-- Desktop/tablet: table view -->
                <div class="hidden sm:block overflow-x-auto">
                    <table class="min-w-full">
                        <thead class="bg-gradient-to-r from-primary to-secondary text-white">
                            <tr>
                                <th class="px-4 py-3 text-left text-sm font-bold uppercase tracking-wider" data-sort="rank">#</th>
                                <th class="px-6 py-3 text-left text-sm font-bold uppercase tracking-wider" data-sort="name">Team</th>
                                <th class="px-3 py-3 text-center text-sm font-bold uppercase tracking-wider" data-sort="gp">GP</th>
                                <th class="px-3 py-3 text-center text-sm font-bold uppercase tracking-wider" data-sort="wins">W</th>
                                <th class="px-3 py-3 text-center text-sm font-bold uppercase tracking-wider" data-sort="losses">L</th>
                                <th class="px-3 py-3 text-center text-sm font-bold uppercase tracking-wider" data-sort="otl">OTL</th>
                                <th class="px-3 py-3 text-center text-sm font-bold uppercase tracking-wider" data-sort="points">PTS</th>
                                <th class="px-3 py-3 text-center text-sm font-bold uppercase tracking-wider" data-sort="gf">GF</th>
                                <th class="px-3 py-3 text-center text-sm font-bold uppercase tracking-wider" data-sort="ga">GA</th>
                                <th class="px-3 py-3 text-center text-sm font-bold uppercase tracking-wider" data-sort="diff">Diff</th>
                                <th class="px-4 py-3 text-center text-sm font-bold uppercase tracking-wider" data-sort="l10">L10</th>
                                <th class="px-4 py-3 text-center text-sm font-bold uppercase tracking-wider" data-sort="streak">Strk</th>
                                <th class="px-4 py-3 text-center text-sm font-bold uppercase tracking-wider" data-sort="winpct">Win%</th>
                                <th class="px-4 py-3 text-center text-sm font-bold uppercase tracking-wider" data-sort="ppct">P%</th>
                            </tr>
                        </thead>
                        <tbody id="standingsBody" class="divide-y divide-gray-200">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        </section>
    </div>

    <script src="/static/standings.js"></script>
<script src="/static/season-browser.js"></script>
</body>
</html>
