<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scores & Schedule - Barnwide</title>
    <link rel="icon" href="/static/favicon.ico?v=barnwide" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v=barnwide">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v=barnwide">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/utilities.css">
<link rel="stylesheet" href="/static/design.css">
<script src="/static/site.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
<a class="skip-link" href="#mainContent">Skip to content</a>
<nav class="site-nav" aria-label="Main navigation"><a class="brand" href="/"><img class="brand-arena" src="/static/barnwide-mark.png" width="64" height="44" alt=""><span>Barnwide</span></a><div class="nav-links"><a href="/">Teams</a><a href="/scores">Scores</a><a href="/standings">Standings</a></div></nav>
<div id="dataStatus" class="data-status hidden" role="status"></div>

    <div id="mainContent" class="max-w-7xl mx-auto px-4 sm:px-6 py-6">
        <header class="bg-gradient-to-r from-primary to-secondary text-white rounded-2xl p-6 shadow-lg mb-6 relative overflow-hidden">
            <div class="absolute inset-0 bg-[radial-gradient(circle_at_80%_20%,rgba(255,255,255,0.2),transparent_60%)]"></div>
            <div class="relative z-10 flex items-center justify-between">
                <h1 class="text-3xl font-extrabold tracking-tight flex items-center gap-3"><span></span> Scores & Schedule</h1>

            </div>
        </header>

        <div class="date-navigation">
            <button id="prevDay">← Previous day</button>
            <div><div id="currentDate"></div><button id="todayBtn">Today</button></div>
            <button id="nextDay">Next day →</button>
        </div>
        <!-- Loading State -->
        <div id="loading" class="text-center py-12 text-gray-500 text-lg">Loading games...</div>

        <!-- Error State -->
        <div id="error" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4"></div>

        <!-- Games Grid -->
        <div id="gamesContainer" class="hidden">
            <div id="gamesGrid" class="score-list"></div>
            <div id="noGames" class="hidden text-center py-12 text-gray-500">
                <div class="text-6xl mb-4"></div>
                <div class="text-xl font-semibold">No games scheduled for this date</div>
            </div>
        </div>
    </div>

    <script src="/static/game-details.js"></script>
    <script src="/static/scores.js"></script>
</body>
</html>
